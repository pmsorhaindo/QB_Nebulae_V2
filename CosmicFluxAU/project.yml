name: CosmicFluxAU
options:
  bundleIdPrefix: com.cosmicflux
  deploymentTarget:
    iOS: "14.0"
  developmentLanguage: en

settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  CosmicFluxAU:
    type: application
    platform: iOS
    sources:
      - HostApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cosmicflux.au
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_FILE: HostApp/Info.plist
      PRODUCT_NAME: CosmicFluxAU
      TARGETED_DEVICE_FAMILY: "1,2"
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: CosmicFluxAUAudioUnit
    preBuildScripts:
      - script: |
          echo "Building CosmicFluxAU Host App..."
        name: "Pre-Build Log"
    
  CosmicFluxAUAudioUnit:
    type: app-extension
    platform: iOS
    sources:
      - Extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cosmicflux.au.audiounit
      INFOPLIST_FILE: Extension/Info.plist
      PRODUCT_NAME: CosmicFluxAUAudioUnit
      TARGETED_DEVICE_FAMILY: "1,2"
      IPHONEOS_DEPLOYMENT_TARGET: "14.0"
      SKIP_INSTALL: YES
    preBuildScripts:
      - script: |
          echo "Building CosmicFluxAU Audio Unit Extension..."
        name: "Pre-Build Log"

schemes:
  CosmicFluxAU:
    build:
      targets:
        CosmicFluxAU: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
