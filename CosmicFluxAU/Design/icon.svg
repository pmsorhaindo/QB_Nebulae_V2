<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Radial gradients for nebula glow effect -->
    <radialGradient id="nebulaGlow1" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#9b4dff;stop-opacity:0.8"/>
      <stop offset="40%" style="stop-color:#7b2cbf;stop-opacity:0.5"/>
      <stop offset="70%" style="stop-color:#4a148c;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="nebulaGlow2" cx="65%" cy="55%" r="50%">
      <stop offset="0%" style="stop-color:#c77dff;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#9d4edd;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="nebulaGlow3" cx="30%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:#e0aaff;stop-opacity:0.5"/>
      <stop offset="60%" style="stop-color:#7209b7;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Filter for blur/haze effect -->
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    
    <filter id="blur2">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="blur3">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Deep black background -->
  <rect width="1024" height="1024" fill="#000000"/>
  
  <!-- Layered nebula glows with blur for hazy effect -->
  <circle cx="410" cy="410" r="550" fill="url(#nebulaGlow1)" filter="url(#blur1)" opacity="0.9"/>
  <circle cx="665" cy="563" r="450" fill="url(#nebulaGlow2)" filter="url(#blur2)" opacity="0.8"/>
  <circle cx="307" cy="717" r="380" fill="url(#nebulaGlow3)" filter="url(#blur3)" opacity="0.7"/>
  
  <!-- Subtle star field -->
  <g opacity="0.6">
    <!-- Larger stars with slight glow -->
    <circle cx="200" cy="150" r="3" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="750" cy="200" r="2.5" fill="#e0aaff" filter="url(#starGlow)"/>
    <circle cx="850" cy="350" r="2" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="150" cy="450" r="2.5" fill="#c77dff" filter="url(#starGlow)"/>
    <circle cx="900" cy="550" r="2" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="250" cy="650" r="3" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="700" cy="750" r="2.5" fill="#e0aaff" filter="url(#starGlow)"/>
    <circle cx="500" cy="850" r="2" fill="#ffffff" filter="url(#starGlow)"/>
    <circle cx="100" cy="800" r="2.5" fill="#c77dff" filter="url(#starGlow)"/>
    
    <!-- Smaller distant stars (no glow, more subtle) -->
    <circle cx="320" cy="180" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="620" cy="120" r="1" fill="#e0aaff" opacity="0.6"/>
    <circle cx="480" cy="220" r="1.2" fill="#ffffff" opacity="0.7"/>
    <circle cx="780" cy="280" r="1" fill="#c77dff" opacity="0.6"/>
    <circle cx="920" cy="180" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="180" cy="320" r="1" fill="#e0aaff" opacity="0.6"/>
    <circle cx="650" cy="420" r="1.2" fill="#ffffff" opacity="0.7"/>
    <circle cx="350" cy="520" r="1" fill="#c77dff" opacity="0.6"/>
    <circle cx="820" cy="680" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="450" cy="580" r="1" fill="#e0aaff" opacity="0.6"/>
    <circle cx="150" cy="720" r="1.2" fill="#ffffff" opacity="0.7"/>
    <circle cx="580" cy="920" r="1" fill="#c77dff" opacity="0.6"/>
    <circle cx="380" cy="880" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="880" cy="820" r="1" fill="#e0aaff" opacity="0.6"/>
    <circle cx="280" cy="950" r="1.2" fill="#ffffff" opacity="0.7"/>
  </g>
  
  <!-- Additional soft haze overlay for depth -->
  <ellipse cx="512" cy="512" rx="450" ry="500" fill="url(#nebulaGlow1)" filter="url(#blur1)" opacity="0.3"/>
</svg>
